<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>ページタイトル</title>
</head>
<body>
    <h1 class="flex justify-center font-bold text-2xl shadow mt-4">メンバー紹介</h1>
    <div id="memberList" class="grid gap-4"></div> <!-- ・gridはなにも指定していないとき、縦並びになる
    　　　　　　　　　　　　　　　　　　　　　　　　　　　　　・divの高さはほぼ0だけど画面の大きさに合わせて変化する -->
    <script>
        const members = [
            { name: "栗田桂佑", role: "長男" ,comment: "片付けができない"},
            { name:"栗田知明", role: "父" ,comment: "音痴"},
            { name:"栗田麻里子", role:"母" , comment: "酒豪"},
        ];

        const memberList = document.getElementById("memberList")
        
        members.forEach((member) => {
            const card = document.createElement("div")
            card.className = "rounded-lg shadow"//カード要素をつくっている
            
        
            card.innerHTML = `
            <h2 class="text-lg font-bold">${member.name}</h2>
            <p class="text-small text-blue-600">${member.role}</p>
            <p class="mt-2">${member.comment}</p>
            `;
             
            memberList.appendChild(card);
        
        });
    </script>
</body>
</html>
